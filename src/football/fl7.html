<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080D18">
<title>WINNER69 Football League 7</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Kanit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>:root{--bg:#080D18;--bg2:#0C1322;--card:#111B2A;--card2:#16233A;--line:#22324B;--gold:#F5C451;--gold2:#C9971F;--text:#E8EEF8;--muted:#8DA0BC;--live:#2BE38A;--danger:#FF5C6C;--warn:#FFB547;--pitch:#1F7A3D;--pitch2:#23863F;--blue:#5AA9FF;
--r-lg:18px;--r-md:12px;--r-sm:8px;--shadow:0 10px 30px rgba(0,0,0,.35);--display:"Kanit","IBM Plex Sans Thai",system-ui,sans-serif;--body:"IBM Plex Sans Thai","Kanit",system-ui,sans-serif}
:root:not([data-theme="light"]){color-scheme:dark}
*{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(64px + env(safe-area-inset-top,0px))}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
body{min-height:100%;background:radial-gradient(1200px 500px at 50% -200px,rgba(245,196,81,.10),transparent 70%),var(--bg)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
img,svg,canvas{max-width:100%}
.wrap{max-width:1180px;margin:0 auto;padding:0 14px}
/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(8,13,24,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;gap:12px;height:60px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.brand .mark{font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:.5px;color:#fff;line-height:1}
.brand .mark b{color:var(--gold)}
.brand .sub{font-family:var(--display);font-size:11.5px;color:var(--muted);line-height:1.1;font-weight:500}
.nav{display:flex;gap:2px;margin-left:12px}
.nav a{padding:8px 12px;border-radius:10px;text-decoration:none;color:var(--muted);font-weight:500;font-size:14.5px}
.nav a:hover{color:var(--text);background:var(--card)}
.nav a.on{color:var(--gold);background:rgba(245,196,81,.08)}
.hdr .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.credits{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);padding:6px 11px;border-radius:999px;font-size:13.5px;white-space:nowrap}
.credits .coin{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFE7A3,var(--gold) 55%,var(--gold2));box-shadow:0 0 10px rgba(245,196,81,.5)}
.credits .num{font-weight:600;color:var(--gold)}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{border-color:#36507a}
.demo-strip{background:repeating-linear-gradient(135deg,rgba(245,196,81,.12) 0 12px,rgba(245,196,81,.04) 12px 24px);border-bottom:1px solid rgba(245,196,81,.25);font-size:12.5px;color:#F8DC95;text-align:center;padding:5px 10px}
/* bottom nav */
.bnav{display:none}
@media (max-width:860px){.nav{display:none}.bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:45;background:rgba(10,16,29,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;text-decoration:none;color:var(--muted);font-size:11.5px;font-weight:500;min-height:56px;justify-content:center}
.bnav a.on{color:var(--gold)}.bnav svg{width:22px;height:22px}
main{padding-bottom:90px}.brand .sub{display:none}}
main{padding-top:16px;padding-bottom:40px}
/* type */
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;line-height:1.2}
h1{font-size:26px}h2{font-size:19px}h3{font-size:16px}
.sec{margin:22px 0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.sec-h .link{color:var(--gold);font-size:14px;text-decoration:none;font-weight:500;background:none;border:0;cursor:pointer;padding:6px 0}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg)}
.pad{padding:14px}
.grid{display:grid;gap:14px}
@media(min-width:900px){.g2{grid-template-columns:1.35fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}}
@media(min-width:620px){.gt{grid-template-columns:repeat(2,1fr)}}@media(min-width:980px){.gt{grid-template-columns:repeat(3,1fr)}}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-weight:600;cursor:pointer;text-decoration:none;transition:background .15s,transform .05s,border-color .15s;font-size:14.5px}
.btn:hover{border-color:#3b5784;background:#1b2b46}
.btn:active{transform:translateY(1px) scale(.99)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn.gold{background:linear-gradient(180deg,#FFD978,var(--gold) 60%,#E3AE33);color:#1C1404;border-color:#F8D27A;box-shadow:0 6px 18px rgba(245,196,81,.25)}
.btn.gold:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent}
.btn.danger{background:rgba(255,92,108,.12);border-color:rgba(255,92,108,.45);color:#FFB3BB}
.btn.sm{min-height:36px;padding:0 11px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn.loading{pointer-events:none;color:transparent;position:relative}
.btn.loading::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(0,0,0,.25);border-top-color:#1C1404;animation:spin .7s linear infinite}
.btn:not(.gold).loading::after{border-color:rgba(255,255,255,.2);border-top-color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:6px 13px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;text-align:center;line-height:1.2;font-size:13px}
.chip b{display:block;font-family:var(--display);font-size:15px;font-weight:600}
.chip.on{border-color:var(--gold);background:rgba(245,196,81,.1);color:var(--gold)}
/* status */
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;font-family:var(--display);letter-spacing:.2px}
.st.live{background:rgba(43,227,138,.14);color:var(--live)}
.st.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--live);box-shadow:0 0 0 0 rgba(43,227,138,.7);animation:pulse 1.4s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(43,227,138,0)}100%{box-shadow:0 0 0 0 rgba(43,227,138,0)}}
.st.ht{background:rgba(255,181,71,.14);color:var(--warn)}
.st.sched{background:rgba(90,169,255,.12);color:#9CCBFF}
.st.ft{background:rgba(141,160,188,.15);color:#C6D2E3}
.st.pend{background:rgba(245,196,81,.14);color:var(--gold)}
.st.pp{background:rgba(255,181,71,.12);color:#FFCF8A}
.st.cx{background:rgba(255,92,108,.12);color:#FF9BA6}
.st.sim{background:transparent;border:1px dashed #3a4d6b;color:var(--muted);font-weight:500}
/* match rows */
.mrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line);text-decoration:none}
.mrow:first-child{border-top:0}
.mrow:hover{background:rgba(255,255,255,.02)}
.tm{display:flex;align-items:center;gap:9px;min-width:0;font-weight:600}
.tm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm.away{flex-direction:row-reverse;text-align:right}
.mid{text-align:center;min-width:76px}
.mid .sc{font-family:var(--display);font-size:22px;font-weight:700;line-height:1}
.mid .tt{font-family:var(--display);font-size:18px;font-weight:600;color:var(--gold)}
.mmeta{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-top:-2px}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:22px;border:1px solid #2a3c58;background:linear-gradient(180deg,#0E1A2C,#0A1220)}
.hero .board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:16px 16px 10px}
.hero .team{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-family:var(--display);font-weight:600;font-size:15px;line-height:1.2}
.hero .score{font-family:var(--display);font-weight:800;font-size:52px;line-height:1;letter-spacing:2px;text-align:center;text-shadow:0 0 30px rgba(245,196,81,.25)}
.hero .score .sep{color:var(--muted);font-weight:400;margin:0 6px}
.hero .clock{font-family:var(--display);font-size:17px;color:var(--live);text-align:center;font-weight:600}
.hero .kick{font-family:var(--display);font-size:34px;font-weight:700;color:var(--gold);text-align:center;line-height:1}
.hero .foot{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:10px 14px 14px;flex-wrap:wrap}
@media(min-width:700px){.hero .score{font-size:68px}.hero .team{font-size:18px}}
.pitchbox{position:relative;margin:0 12px;border-radius:14px;overflow:hidden;background:#0d3a1d;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.pitchbox canvas{display:block;width:100%;height:auto}
.goalfx{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;pointer-events:none;background:radial-gradient(circle,rgba(245,196,81,.25),rgba(0,0,0,.55) 70%)}
.goalfx.on{display:flex;animation:gin .35s ease-out}
.goalfx .g{font-family:var(--display);font-weight:800;font-size:clamp(48px,12vw,110px);color:var(--gold);letter-spacing:4px;text-shadow:0 4px 0 #7a5810,0 0 40px rgba(245,196,81,.7);line-height:1}
.goalfx .who{font-family:var(--display);font-size:18px;font-weight:600;margin-top:6px}
@keyframes gin{from{transform:scale(1.3);opacity:0}to{transform:scale(1);opacity:1}}
.htfx{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(8,13,24,.8);border:1px solid var(--line);border-radius:999px;padding:4px 14px;font-family:var(--display);font-size:13px;display:none}
.htfx.on{display:block}
@media (prefers-reduced-motion:reduce){.goalfx.on{animation:none}.st.live::before{animation:none}}
/* table */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
.tbl th{font-weight:500;color:var(--muted);font-size:12.5px;text-align:center;padding:10px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{text-align:center;padding:9px 6px;border-bottom:1px solid rgba(34,50,75,.6);font-variant-numeric:tabular-nums}
.tbl td.t{text-align:left}.tbl th.t{text-align:left}
.tbl tr.top td:first-child{box-shadow:inset 3px 0 0 var(--gold)}
.tbl tr.top{background:linear-gradient(90deg,rgba(245,196,81,.07),transparent 60%)}
.tbl .pts{font-family:var(--display);font-weight:700;font-size:16px;color:var(--gold)}
.tbl.compact{min-width:0}
.form{display:inline-flex;gap:3px}.form i{width:18px;height:18px;border-radius:5px;display:inline-grid;place-items:center;font-size:10.5px;font-style:normal;font-weight:700;font-family:var(--display)}
.form .W{background:#1f8f55;color:#E6FFF1}.form .D{background:#5b6880;color:#fff}.form .L{background:#b33a48;color:#fff}.form .N{background:var(--card2);color:var(--muted)}
/* bars */
.bar{height:8px;border-radius:99px;background:#1A2740;overflow:hidden}.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold2),var(--gold))}
.prob{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:8px 0}
/* predict */
.pickgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pick{min-height:74px;border-radius:14px;border:1.5px solid var(--line);background:var(--card2);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px;transition:border-color .15s,background .15s}
.pick .lb{font-size:12.5px;color:var(--muted);text-align:center;line-height:1.2}
.pick .od{font-family:var(--display);font-size:22px;font-weight:700}
.pick:hover{border-color:#3b5784}
.pick.on{border-color:var(--gold);background:rgba(245,196,81,.12)}.pick.on .od{color:var(--gold)}
.pick[disabled]{opacity:.5;cursor:not-allowed}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card2);font-size:20px;cursor:pointer}
.stepper .v{width:44px;text-align:center;font-family:var(--display);font-size:26px;font-weight:700}
.summary{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px;background:#0C1524;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.summary .v{text-align:right;font-family:var(--display);font-weight:600}
.notice{border-radius:12px;padding:10px 12px;font-size:13px;background:rgba(90,169,255,.08);border:1px solid rgba(90,169,255,.25);color:#C5DEFF}
.notice.gold{background:rgba(245,196,81,.07);border-color:rgba(245,196,81,.3);color:#F6DE9F}
.notice.err{background:rgba(255,92,108,.08);border-color:rgba(255,92,108,.3);color:#FFC2C9}
.notice.ok{background:rgba(43,227,138,.08);border-color:rgba(43,227,138,.3);color:#B6F5D5}
/* misc */
.kv{display:grid;grid-template-columns:1fr auto 1fr;gap:6px 10px;align-items:center;font-size:14px}
.kv .c{color:var(--muted);text-align:center;font-size:12.5px}
.kv .l{text-align:left;font-family:var(--display);font-weight:600}.kv .r{text-align:right;font-family:var(--display);font-weight:600}
.tabs{display:flex;gap:4px;background:var(--bg2);border:1px solid var(--line);padding:4px;border-radius:14px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:1 0 auto;min-height:40px;border:0;background:none;border-radius:10px;padding:0 14px;color:var(--muted);font-weight:500;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--card2);color:var(--text);box-shadow:0 1px 0 rgba(255,255,255,.04) inset}
.log{max-height:420px;overflow:auto;font-size:13.5px}
.log .ev{display:grid;grid-template-columns:52px 1fr;gap:8px;padding:7px 12px;border-top:1px solid rgba(34,50,75,.6)}
.log .ev .t{font-family:var(--display);color:var(--muted);font-variant-numeric:tabular-nums}
.log .ev.goal{background:rgba(245,196,81,.08)}.log .ev.goal .x{color:var(--gold);font-weight:700}
.log .ev.key .x{font-weight:600}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.empty{padding:30px 16px;text-align:center;color:var(--muted)}
.skel{background:linear-gradient(90deg,#132036,#1a2a44,#132036);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:12px;height:70px}
@keyframes sk{to{background-position:-200% 0}}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:13px;color:var(--muted)}
.inp{min-height:44px;border-radius:11px;border:1px solid var(--line);background:#0B1322;padding:0 12px;width:100%}
textarea.inp{padding:10px 12px;min-height:80px}
.inp:focus{border-color:var(--gold);outline:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:760px){.kpis{grid-template-columns:repeat(6,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi .v{font-family:var(--display);font-size:26px;font-weight:700;line-height:1.1}.kpi .k{font-size:12.5px;color:var(--muted)}
.pl{display:grid;grid-template-columns:34px 1fr auto auto;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid rgba(34,50,75,.6);font-size:14px}
.pl .n{font-family:var(--display);font-weight:700;color:var(--gold);text-align:center}
.pos{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:#1B2A44;color:#A9C3E8;font-family:var(--display)}
.pos.GK{background:#3b2f0d;color:#FFD979}.pos.DEF{background:#13314a;color:#8ECBFF}.pos.MID{background:#14382a;color:#86E3B3}.pos.FWD{background:#3d1a20;color:#FF9FAA}
/* modal & toast */
.modal-bg{position:fixed;inset:0;z-index:80;background:rgba(3,6,12,.72);display:flex;align-items:flex-end;justify-content:center;padding:0;animation:fade .15s}
@media(min-width:640px){.modal-bg{align-items:center;padding:20px}}
.modal{background:var(--card);border:1px solid #2b3e5d;border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:90vh;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow)}
@media(min-width:640px){.modal{border-radius:20px}}
@keyframes fade{from{opacity:0}}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:90;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px)}
.toast{background:#17243B;border:1px solid #2f4566;border-radius:12px;padding:11px 14px;font-size:14px;box-shadow:var(--shadow);animation:fade .2s}
.toast.err{border-color:rgba(255,92,108,.5)}.toast.ok{border-color:rgba(43,227,138,.45)}
.disclaim{font-size:12px;color:var(--muted);border-left:3px solid var(--gold2);padding:4px 10px;margin-top:10px}
.foot{padding:26px 0 30px;color:var(--muted);font-size:12.5px;text-align:center}
.teamhead{display:flex;gap:16px;align-items:center;padding:18px;border-radius:20px;border:1px solid var(--line)}
.split{display:flex;justify-content:space-between;gap:10px;align-items:center}
.hide-m{}@media(max-width:620px){.hide-m{display:none}}
.grid>*{min-width:0}.mrow>*{min-width:0}
@media(max-width:520px){.tbl.compact th,.tbl.compact td{padding:9px 4px}.tbl.compact td.t span{display:inline-block;max-width:118px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}.tbl.compact .tm .logo{width:20px;height:20px}}
.prob .split{flex-wrap:wrap;row-gap:2px}
</style></head>

<script>/* WINNER69 FOOTBALL LEAGUE 7 — core engines (UI-independent, deterministic, testable)
 * modules: rng, teams, league-scheduler, match-engine, standings, odds/model,
 *          demo-credit-engine, prediction-engine, league service (backend layer)
 */
(function (root) {
  'use strict';

  /* ===================== RNG (seeded) ===================== */
  function hashStr(s) {
    let h = 2166136261 >>> 0;
    s = String(s);
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function makeRng(seed) {
    let a = (typeof seed === 'number' ? seed : hashStr(seed)) >>> 0;
    const next = function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    return {
      next,

  /* ===================== Probability model (odds & title chances) ===================== */

    else { getT = () => (['scheduled', 'postponed', 'cancelled'].includes(m.status) ? -1 : svc.gameTime(m)); speed = () => (m.run ? m.run.speed : 1); }

/* ---------- Match detail ---------- */
const EV_TXT = {
  kickoff: (e, tn) => `เขี่ยลูก ${tn}`, pass: (e) => `${esc(e.player.name)} ส่งบอลให้ ${esc(e.to.name)}`, dribble: (e) => `${esc(e.player.name)} เลี้ยงบอลขึ้นหน้า`,
  tackle: (e) => `${esc(e.player.name)} แย่งบอลได้`, shot: (e) => `${esc(e.player.name)} ยิง${e.outcome === 'wide' ? 'ออกนอกกรอบ' : e.outcome === 'goal' ? '' : 'เข้ากรอบ'}`,
  save: (e) => `${esc(e.player.name)} เซฟได้`, corner: (e, tn) => `เตะมุม ${tn}`, goal: (e, tn) => `ประตู! ${esc(e.player.name)} (${tn}) สกอร์ ${e.score.home}-${e.score.away}`,
  halftime: (e) => `หมดครึ่งแรก ${e.score.home}-${e.score.away}`, fulltime: (e) => `จบการแข่งขัน ${e.score.home}-${e.score.away}`,
};
const KEY_EV = new Set(['kickoff', 'shot', 'save', 'corner', 'goal', 'halftime', 'fulltime']);
function eventLog(m, upto, all) {
  const ev = svc.simOf(m).events; const i = W69.eventIndexAt(ev, upto);
  const list = ev.slice(0, i + 1).filter((e) => all || KEY_EV.has(e.type)).reverse();
  if (!list.length) return '<div class="empty">ยังไม่มีเหตุการณ์</div>';
  const k = kits(m);
  return list.map((e) => { const tn = e.side ? esc(T(e.side === 'home' ? m.homeId : m.awayId).name) : ''; const c = W69.clockOf(e.t);
    return `<div class="ev ${e.type === 'goal' ? 'goal' : KEY_EV.has(e.type) ? 'key' : ''}"><span class="t">${e.type === 'halftime' ? 'HT' : e.type === 'fulltime' ? 'FT' : W69.fmtClock(c.sec)}</span><span class="x">${e.side ? `<span class="dot" style="background:${k[e.side].fill};box-shadow:0 0 0 1px ${k[e.side].edge}"></span>` : ''}${EV_TXT[e.type](e, tn)}</span></div>`; }).join('');
}
function statsAt(m, upto) {
  const ev = svc.simOf(m).events; const s = { home: { shots: 0, on: 0, passes: 0, tackles: 0, corners: 0, saves: 0, poss: 0 }, away: { shots: 0, on: 0, passes: 0, tackles: 0, corners: 0, saves: 0, poss: 0 } };
  for (let i = 0; i < ev.length && ev[i].t <= upto; i++) { const e = ev[i]; if (!e.side) continue; const x = s[e.side];
    if (e.type === 'shot') { x.shots++; if (e.outcome !== 'wide') x.on++; } else if (e.type === 'pass') x.passes++; else if (e.type === 'tackle') x.tackles++; else if (e.type === 'corner') x.corners++; else if (e.type === 'save') x.saves++;
    const nx = ev[i + 1]; if (nx && e.type !== 'halftime') x.poss += Math.max(0, Math.min(nx.t, upto) - e.t); }
  const tot = s.home.poss + s.away.poss || 1; s.home.pp = Math.round((s.home.poss / tot) * 100); s.away.pp = tot > 1 ? 100 - s.home.pp : 0; if (tot <= 1) s.home.pp = 0;
  const row = (l, a, b) => `<div class="l">${a}</div><div class="c">${l}</div><div class="r">${b}</div>`;
  return `<div class="kv">${row('ครองบอล %', s.home.pp, s.away.pp)}${row('ยิง', s.home.shots, s.away.shots)}${row('ยิงเข้ากรอบ', s.home.on, s.away.on)}${row('ส่งบอล', s.home.passes, s.away.passes)}${row('แย่งบอล', s.home.tackles, s.away.tackles)}${row('เตะมุม', s.home.corners, s.away.corners)}${row('เซฟ', s.home.saves, s.away.saves)}</div>`;
}
function preMatch(m) {

  const sh = W69.teamStrength(T(m.homeId)), sa = W69.teamStrength(T(m.awayId)); const h2h = svc.headToHead(m.homeId, m.awayId);
  const avg = (r, k) => (r.played ? (r[k] / r.played).toFixed(2) : '-');
  const ready = (t) => { const s = t.players.filter((p) => p.starter); return s.length === 7 && s.filter((p) => p.pos === 'GK').length === 1 ? `พร้อม (ตัวจริง 7 สำรอง ${t.players.length - 7})` : 'ไม่พร้อม'; };
  const row = (l, a, b) => `<div class="l">${a}</div><div class="c">${l}</div><div class="r">${b}</div>`;
  return `<div class="kv">${row('อันดับ', rh.rank || '-', ra.rank || '-')}${row('คะแนน', rh.points ?? 0, ra.points ?? 0)}${row('ฟอร์ม 5 นัด', formDots(rh.form), formDots(ra.form))}${row('ประตูได้เฉลี่ย/นัด', avg(rh, 'gf'), avg(ra, 'gf'))}${row('ประตูเสียเฉลี่ย/นัด', avg(rh, 'ga'), avg(ra, 'ga'))}${row('ความแข็งแกร่งรวม', sh.overall, sa.overall)}${row('เกมรุก / เกมรับ', sh.attack + ' / ' + sh.defense, sa.attack + ' / ' + sa.defense)}${row('ความพร้อม', '<span class="small">' + ready(T(m.homeId)) + '</span>', '<span class="small">' + ready(T(m.awayId)) + '</span>')}</div>
  <div style="margin-top:14px"><h3 style="font-size:14.5px">สถิติพบกัน</h3>${h2h.length ? h2h.map((x) => `<div class="split small" style="padding:6px 0;border-top:1px solid var(--line)"><span>${thDate(x.date)}</span><span>${esc(T(x.homeId).name)} <b class="num">${x.result.home}-${x.result.away}</b> ${esc(T(x.awayId).name)}</span></div>`).join('') : '<div class="small muted">ยังไม่เคยพบกันในฤดูกาลนี้</div>'}</div>`;

/* ---------- Prediction ---------- */
function predRow(p) {
  const m = svc.state.matches.find((x) => x.id === p.matchId); const lab = predLabel(p, m);
  const chip = { pending: '<span class="st sched">รอผล</span>', won: '<span class="st live" style="--x:0">ทายถูก</span>', lost: '<span class="st cx">ทายผิด</span>', void: '<span class="st ft">คืนเครดิต</span>' }[p.status];
  return `<div class="pad" style="border-top:1px solid var(--line);padding:10px 14px"><div class="split"><div><b>${lab}</b><div class="tiny muted">${m ? esc(T(m.homeId).name) + ' vs ' + esc(T(m.awayId).name) + ' ' : ''}${thDT(p.placedAt)}</div></div>${chip}</div>
  <div class="split small" style="margin-top:4px"><span class="muted">ใช้ ${fmtN(p.stake)} อัตรา ×${p.odds.toFixed(2)}${p.resultSeen ? ' ผล ' + p.resultSeen : ''}</span><b class="num">${p.status === 'won' ? '+' + fmtN(p.payout) : p.status === 'lost' ? '-' + fmtN(p.stake) : p.status === 'void' ? 'คืน ' + fmtN(p.stake) : 'รับคืน ' + fmtN(p.potential)}</b></div><div class="tiny muted">รหัสรายการ ${p.id}</div></div>`;
}
function predLabel(p, m) {
  if (p.market === 'SCORE') return 'ทายสกอร์ ' + p.pick;
  if (!m) return p.pick; return p.pick === 'draw' ? 'เสมอ' : (p.pick === 'home' ? T(m.homeId).name : T(m.awayId).name) + ' ชนะ';
}
function predictPanel(m) {

  const odds = svc.oddsFor(m); const h = T(m.homeId), a = T(m.awayId); const u = app.session && svc.state.users[app.session.userId];
  const o = pk.market === '1X2' ? (pk.pick ? odds[pk.pick] : null) : W69.scoreOdds(h, a, pk.home, pk.away);

  return `<div class="card pad" id="predict"><div class="split"><h3>ทายผลการแข่งขัน</h3><span class="st sim">${EMBED ? 'อัตราจ่าย' : 'อัตราจำลอง'}</span></div>

    : `<div class="split" style="justify-content:center;gap:16px"><div style="text-align:center"><div class="small muted" style="margin-bottom:4px">${esc(h.name)}</div><div class="stepper"><button data-act="sc" data-s="home" data-d="-1" aria-label="ลดประตูทีมเหย้า">−</button><span class="v">${pk.home}</span><button data-act="sc" data-s="home" data-d="1" aria-label="เพิ่มประตูทีมเหย้า">+</button></div></div><b class="num" style="font-size:24px;margin-top:20px">:</b><div style="text-align:center"><div class="small muted" style="margin-bottom:4px">${esc(a.name)}</div><div class="stepper"><button data-act="sc" data-s="away" data-d="-1" aria-label="ลดประตูทีมเยือน">−</button><span class="v">${pk.away}</span><button data-act="sc" data-s="away" data-d="1" aria-label="เพิ่มประตูทีมเยือน">+</button></div></div></div>

function vHistory(tab) {
  tab = tab || 'results';
  const tabs = `<div class="tabs" style="margin-bottom:14px"><button class="${tab === 'results' ? 'on' : ''}" data-act="go" data-h="#/history/results">ผลการแข่งขัน</button><button class="${tab === 'preds' ? 'on' : ''}" data-act="go" data-h="#/history/preds">คำทายของฉัน</button><button class="${tab === 'credits' ? 'on' : ''}" data-act="go" data-h="#/history/credits">ประวัติเครดิต</button></div>`;
  let body = '';
  if (tab === 'results') {
    const ms = svc.state.matches.filter((m) => ['confirmed', 'finished', 'cancelled'].includes(m.status)).sort((a, b) => b.kickoff - a.kickoff || b.no - a.no);
    body = `<div class="card">${ms.length ? ms.map((m) => matchRow(m, { date: true })).join('') : '<div class="empty">ยังไม่มีผลการแข่งขัน</div>'}</div>`;
  } else if (!app.session) body = '<div class="card empty">เข้าสู่ระบบทดลองเพื่อดูประวัติของคุณ<div style="margin-top:12px"><button class="btn gold" data-act="login">เข้าสู่ระบบทดลอง</button></div></div>';
  else if (tab === 'preds') {
    const ps = svc.state.predictions.filter((p) => p.userId === app.session.userId).sort((a, b) => b.placedAt - a.placedAt);
    const cs = svc.state.champPicks.filter((p) => p.userId === app.session.userId);
    const all = ps.concat(cs); const settled = all.filter((p) => p.status === 'won' || p.status === 'lost');
    const won = settled.filter((p) => p.status === 'won'); const net = won.reduce((t, p) => t + p.potential, 0) - settled.reduce((t, p) => t + p.stake, 0);
    body = `<div class="kpis" style="margin-bottom:14px">${[['คำทายทั้งหมด', all.length], ['ทายถูก', won.length], ['ทายผิด', settled.length - won.length], ['รอผล', all.filter((p) => p.status === 'pending').length], ['อัตราทายถูก', settled.length ? Math.round((won.length / settled.length) * 100) + '%' : '-'], ['สุทธิ (เครดิต)', (net >= 0 ? '+' : '') + fmtN(net)]].map(([k, v]) => `<div class="kpi"><div class="v">${v}</div><div class="k">${k}</div></div>`).join('')}</div>
    <div class="card">${ps.length ? ps.map(predRow).join('') : '<div class="empty">ยังไม่มีคำทาย <a href="#/predict">เริ่มทายผล</a></div>'}</div>`;
  } else {
    const tx = svc.state.ledger.filter((t) => t.userId === app.session.userId).slice().reverse();
    const TY = { INIT: 'เครดิตเริ่มต้น', STAKE: 'ใช้ทายผล', PAYOUT: 'รับคืน', REFUND: 'คืนเครดิต', RESET: 'รีเซ็ตบัญชี' };
    body = `<div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th class="t">เวลา</th><th class="t">รายการ</th><th>จำนวน</th><th>คงเหลือ</th><th class="t">Transaction ID</th></tr></thead><tbody>${tx.map((t) => `<tr><td class="t small">${thDT(t.at)}</td><td class="t">${TY[t.type] || t.type}<div class="tiny muted">${esc(t.note)}</div></td><td class="num" style="color:${t.amount >= 0 ? 'var(--live)' : '#FF9BA6'}">${t.amount >= 0 ? '+' : ''}${fmtN(t.amount)}</td><td class="num">${fmtN(t.balanceAfter)}</td><td class="t tiny muted">${t.id}</td></tr>`).join('')}</tbody></table></div></div>`;
  }
  return `<div class="sec-h"><h1>ประวัติ</h1></div>${tabs}${body}`;
}

function render(keepScroll) {
  parseRoute(); const [r, a] = app.route; const y = window.scrollY;
  let html;
  try {
    html = r === 'fixtures' ? vFixtures() : r === 'table' ? vTable() : r === 'teams' ? vTeams() : r === 'team' ? vTeam(a) : r === 'match' ? vMatch(a) : r === 'predict' ? vPredict() : r === 'champion' ? vChampion() : r === 'history' ? vHistory(a) : r === 'admin' ? vAdmin(a) : vHome();
  } catch (e) { console.error(e); html = `<div class="card pad notice err">แสดงหน้านี้ไม่ได้: ${esc(e.message)} <button class="btn sm" data-act="go" data-h="#/home">กลับหน้าหลัก</button></div>`; }
  renderHeader();
  pitches.clear(); $('#view').innerHTML = html; mountPitches($('#view'));
  lastSig = sigOf(); app.pendingRender = false;
  if (keepScroll) window.scrollTo(0, y);
  const titles = { fixtures: 'โปรแกรมแข่ง', table: 'ตารางคะแนน', teams: 'ทีม', team: 'ทีม', match: 'แมตช์', predict: 'ทายผล', champion: 'ทายทีมแชมป์', history: 'ประวัติ', admin: 'ผู้ดูแลระบบ' };

function sigOf() { return svc.state.matches.filter((m) => m.status === 'live').map((m) => m.id + phase(m) + (m.run && m.run.speed)).join('|') + ':' + svc.state.ledger.length + ':' + svc.state.audit.length; }
window.addEventListener('hashchange', () => { closeModal(); render(false); window.scrollTo(0, 0); });

/* ===== live updates (server clock ticks every second) ===== */
function updateLive() {
  $$('[data-live-clock]').forEach((el) => { const m = svc.state.matches.find((x) => x.id === el.dataset.liveClock); if (m && m.status === 'live') el.textContent = W69.fmtClock(W69.clockOf(svc.gameTime(m)).sec); });
  $$('[data-live-half]').forEach((el) => { const m = svc.state.matches.find((x) => x.id === el.dataset.liveHalf); if (m && m.status === 'live') { const p = phase(m); const c = W69.clockOf(svc.gameTime(m)); el.textContent = p === 'halftime' ? 'พักครึ่ง' : c.half === 1 ? 'ครึ่งแรก' : 'ครึ่งหลัง'; } });
  $$('[data-live-score]').forEach((el) => { const m = svc.state.matches.find((x) => x.id === el.dataset.liveScore); if (!m || m.status !== 'live') return; const s = liveScore(m); const html = el.dataset.fmt === 'big' ? `${s.home}<span class="sep">-</span>${s.away}` : `${s.home} - ${s.away}`; if (el.innerHTML !== html) el.innerHTML = html; });
  $$('[data-countdown]').forEach((el) => { el.textContent = countdown(Number(el.dataset.countdown)); });
  $$('[data-log]').forEach((el) => { const m = svc.state.matches.find((x) => x.id === el.dataset.log); if (!m || m.status !== 'live') return; const up = svc.gameTime(m); const n = W69.eventIndexAt(svc.simOf(m).events, up); if (el.dataset.n != n) { el.dataset.n = n; el.innerHTML = eventLog(m, up, el.dataset.all === '1'); const st = $(`[data-stats="${m.id}"]`); if (st) st.innerHTML = statsAt(m, up); } });
}
setInterval(() => {
  let changed = false; try { changed = svc.tick(); } catch (e) { console.error(e); }
  const typing = document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName) && $('#view').contains(document.activeElement);
  if ((changed || sigOf() !== lastSig || app.pendingRender) && !$('.modal-bg')) { if (typing) app.pendingRender = true; else render(true); }
  else updateLive();
}, 1000);
document.addEventListener('focusout', () => { if (app.pendingRender) setTimeout(() => { if (!document.activeElement || !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) render(true); }, 50); });
window.addEventListener('resize', () => renderHeader());

  homeDate(el) { app.homeDate = el.dataset.d; render(true); },
  gotoToday() { const el = $('#d-' + today()) || $$('[id^="d-"]').find((x) => x.id.slice(2) >= today()); if (el) el.scrollIntoView({ behavior: 'smooth' }); else toast('ไม่มีแมตช์วันนี้'); },
  replay(el) { app.replay = app.replay === el.dataset.id ? null : el.dataset.id; pitchMem.delete(el.dataset.id + ':r'); render(true); },
  log(el) { app.allLog = el.dataset.v === '1'; render(true); },
  market(el) { app.pick.market = el.dataset.v; render(true); },
  pick(el) { app.pick.pick = el.dataset.v; render(true); },
  prepick(el, e) { app.pick = { matchId: el.dataset.id, market: '1X2', pick: el.dataset.v, home: 1, away: 1, stake: (app.pick && app.pick.stake) || svc.state.settings.stakeOptions[1] || svc.state.settings.stakeOptions[0] }; },
  sc(el) { const k = el.dataset.s; app.pick[k] = Math.max(0, Math.min(15, app.pick[k] + Number(el.dataset.d))); render(true); },
  stake(el) { app.pick.stake = Number(el.dataset.v); render(true); },
  reviewPred() {
    const pk = app.pick; const m = svc.match(pk.matchId); const odds = svc.oddsFor(m);
    const o = pk.market === '1X2' ? odds[pk.pick] : W69.scoreOdds(T(m.homeId), T(m.awayId), pk.home, pk.away);
    const label = pk.market === '1X2' ? predLabel({ market: '1X2', pick: pk.pick }, m) : 'ทายสกอร์ ' + pk.home + '-' + pk.away;
    const key = uidKey(); const ret = Math.round(pk.stake * o * 100) / 100; const u = svc.state.users[app.session.userId];
    modal(`<h2>ยืนยันคำทาย</h2><p class="small muted" style="margin:4px 0 12px">${esc(T(m.homeId).name)} vs ${esc(T(m.awayId).name)} ${thDT(m.kickoff)}</p>
      <div class="summary"><span class="muted">คำทาย</span><span class="v">${esc(label)}</span><span class="muted">เครดิตที่ใช้</span><span class="v">${fmtN(pk.stake)}</span><span class="muted">${EMBED ? 'อัตราจ่าย' : 'อัตราจำลอง'}</span><span class="v">×${o.toFixed(2)}</span><span class="muted">หากทายถูก รับคืนรวม</span><span class="v" style="color:var(--gold)">${fmtN(ret)} (กำไร ${fmtN(ret - pk.stake)})</span><span class="muted">หากทายผิด</span><span class="v">เสีย ${fmtN(pk.stake)}</span><span class="muted">เครดิตก่อน / หลังยืนยัน</span><span class="v">${fmtN(u.balance)} / ${fmtN(u.balance - pk.stake)}</span></div>
      <p class="tiny muted" style="margin:10px 0">ยืนยันแล้วแก้ไขหรือยกเลิกไม่ได้ ${EMBED ? 'อัตราจ่าย' : 'อัตราจำลอง'}ล็อกตามเวลาที่ยืนยัน หากระบบปิดรับก่อนส่งถึง รายการจะไม่ถูกบันทึก</p>
      <div class="row" style="justify-content:flex-end"><button class="btn ghost" data-close>กลับไปแก้ไข</button><button class="btn gold" id="go">ยืนยันคำทาย</button></div>`,
    (md) => md.querySelector('#go').addEventListener('click', (e) => {
      const btn = e.currentTarget; btn.classList.add('loading'); btn.disabled = true;
      const req = { matchId: m.id, market: pk.market, pick: pk.pick, home: pk.home, away: pk.away, stake: pk.stake, requestKey: key };
      const showDone = (p, left) => {
          md.innerHTML = `<h2>บันทึกคำทายแล้ว</h2><div class="notice ok" style="margin:12px 0">${esc(label)} ใช้ ${fmtN(p.stake)} เครดิต อัตรา ×${p.odds.toFixed(2)}</div><div class="summary"><span class="muted">รหัสคำทาย</span><span class="v tiny">${p.id}</span><span class="muted">Transaction ID</span><span class="v tiny">${p.txId}</span><span class="muted">เครดิตคงเหลือ</span><span class="v">${fmtN(left)}</span></div><div class="row" style="justify-content:flex-end;margin-top:14px"><a class="btn" href="#/history/preds">ดูประวัติคำทาย</a><button class="btn gold" data-close>เสร็จสิ้น</button></div>`;
          renderHeader(); render(true);
      };
      const showErr = (err) => { btn.classList.remove('loading'); btn.disabled = false; md.querySelector('.notice.err')?.remove(); btn.parentElement.insertAdjacentHTML('beforebegin', `<div class="notice err" style="margin-bottom:10px">${esc(err.message)}</div>`); };
      if (LINK) { // the server takes the stake from the WINNER 69 wallet and records the prediction
        linkAct('placePrediction', [req]).then((p) => { const u = svc.state.users[app.session.userId]; const left = u ? u.balance - (p && p.stake || 0) : 0; if (u) u.balance = left; showDone(p, left); }, showErr);
        return;
      }
      setTimeout(() => { // simulate network latency so loading state & double-tap protection are visible
        try { const p = svc.placePrediction(app.session, req); showDone(p, svc.balance(app.session.userId)); }
        catch (err) { showErr(err); }
      }, 450);
    }));
  },
  champPick(el) { app.champ.teamId = el.dataset.v; render(true); },
  champStake(el) { app.champ.stake = Number(el.dataset.v); render(true); },
  reviewChamp() {
    const cp = app.champ; const key = uidKey();
    confirmBox('ยืนยันทีมแชมป์', `เลือก <b>${esc(T(cp.teamId).name)}</b> ใช้ ${fmtN(cp.stake)} เครดิต เลือกได้ครั้งเดียวต่อฤดูกาล และแก้ไขไม่ได้หลังยืนยัน`, 'ยืนยันทีมแชมป์', () => {
      const req = { teamId: cp.teamId, stake: cp.stake, requestKey: key };
      if (LINK) { linkAct('placeChampionPick', [req]).then((p) => toast('บันทึกคำทายแชมป์แล้ว ' + p.id, 'ok'), (e) => toast(e.message || 'บันทึกไม่สำเร็จ', 'err')); return true; }
      const p = svc.placeChampionPick(app.session, req); toast('บันทึกคำทายแชมป์แล้ว ' + p.id, 'ok'); return p; });
  },
  adminLogout() { app.admin = null; ls.set(ADMIN_KEY, null); render(false); },
  startNow(el) {
    const id = el.dataset.id;
    modal(`<h2>เริ่มแมตช์ทันที</h2><p class="small muted">ระบบจะปิดรับคำทายทันที และเปลี่ยนเวลาเริ่มเป็นตอนนี้ (บันทึกใน Audit Log)</p><div class="field"><label>ความเร็ว</label><select class="inp" id="spd"><option value="1">x1 เวลาจริง (35 นาที)</option><option value="5">x5 ทดสอบ (7 นาที)</option><option value="15" selected>x15 ทดสอบระบบ (2 นาที 20 วินาที)</option></select></div><div class="row" style="justify-content:flex-end"><button class="btn ghost" data-close>ยกเลิก</button><button class="btn gold" id="ok">เริ่มเลย</button></div>`,
      (md) => md.querySelector('#ok').addEventListener('click', (e) => { if (call(e.currentTarget, () => (svc.adminStartNow(adminTok(), id, Number(md.querySelector('#spd').value)), true), 'เริ่มแมตช์แล้ว')) { closeModal(); goHash('#/match/' + id); render(true); } }));
  },
  speed(el) { call(null, () => svc.adminSetSpeed(adminTok(), el.dataset.id, Number(el.dataset.v)), 'ปรับความเร็วเป็น x' + el.dataset.v); render(true); },
  pause(el) { const m = svc.match(el.dataset.id); call(null, () => svc.adminPause(adminTok(), m.id, !m.run.paused)); render(true); },
  finishNow(el) { confirmBox('จำลองแมตช์ให้จบทันที', 'ระบบจะคำนวณผลจาก Match Engine ทันที (ผลเดียวกับที่แสดงในสนาม)', 'จำลองจบ', () => (svc.adminFinishNow(adminTok(), el.dataset.id), true)); },
  confirm(el) { call(null, () => svc.adminConfirm(adminTok(), el.dataset.id), 'ยืนยันผลและตัดสินคำทายแล้ว'); render(true); },
  markPostponed(el) { reasonBox('เลื่อนการแข่งขัน (ยังไม่กำหนดวัน)', 'เลื่อน', (r) => svc.adminMarkPostponed(adminTok(), el.dataset.id, r)); },
  cancelMatch(el) { reasonBox('ยกเลิกการแข่งขัน', 'ยกเลิกแมตช์', (r) => svc.adminCancel(adminTok(), el.dataset.id, r), 'คำทายที่ค้างอยู่ของแมตช์นี้จะได้รับเครดิตคืนทั้งหมด'); },
  reschedule(el) {
    const m = svc.match(el.dataset.id);
    modal(`<h2>เปลี่ยนวันแข่ง</h2><p class="small muted">${esc(T(m.homeId).name)} vs ${esc(T(m.awayId).name)} (เดิม ${thDate(m.date)} ${m.time} น.) เวลาไทย</p>
      <form id="rf"><div class="row"><div class="field"><label>วันที่</label><input class="inp" type="date" name="d" value="${m.date}" required></div><div class="field"><label>เวลา</label><input class="inp" type="time" name="t" value="${m.time}" required></div></div><div class="field"><label>เหตุผล</label><input class="inp" name="r" required></div><button class="btn gold block" type="submit">บันทึกวันแข่งใหม่</button></form>`,
    (md) => md.querySelector('#rf').addEventListener('submit', (e) => { e.preventDefault(); const f = e.target; if (call(e.submitter, () => (svc.adminPostpone(adminTok(), m.id, f.d.value, f.t.value, f.r.value), true), 'เปลี่ยนวันแข่งแล้ว')) { closeModal(); render(true); } }));
  },
  editResult(el) {
    const m = svc.match(el.dataset.id);
    modal(`<h2>แก้ไขผลการแข่งขัน</h2><p class="small muted">ผลปัจจุบัน ${m.result.home}-${m.result.away} การแก้ไขจะถูกบันทึกใน Audit Log พร้อมค่าเดิม/ค่าใหม่ คำทายที่ตัดสินแล้วจะไม่ถูกตัดสินซ้ำ</p>
      <form id="ef"><div class="row"><div class="field"><label>${esc(T(m.homeId).name)}</label><input class="inp" type="number" min="0" max="30" name="h" value="${m.result.home}" style="width:100px"></div><div class="field"><label>${esc(T(m.awayId).name)}</label><input class="inp" type="number" min="0" max="30" name="a" value="${m.result.away}" style="width:100px"></div></div>
      <div class="field"><label>เหตุผล (จำเป็น)</label><textarea class="inp" name="r" required minlength="5"></textarea></div><button class="btn gold block" type="submit">บันทึกการแก้ไข</button></form>`,
    (md) => md.querySelector('#ef').addEventListener('submit', (e) => { e.preventDefault(); const f = e.target; if (call(e.submitter, () => (svc.adminEditResult(adminTok(), m.id, f.h.value, f.a.value, f.r.value), true), 'แก้ไขผลแล้ว')) { closeModal(); render(true); } }));
  },
  simToday() { confirmBox('จำลองแมตช์วันนี้', 'จำลองทุกแมตช์ของวันนี้ที่ยังไม่จบให้จบทันที', 'จำลอง', () => { svc.state.matches.filter((m) => m.date === today() && ['scheduled', 'live'].includes(m.status)).forEach((m) => svc.adminFinishNow(adminTok(), m.id)); return true; }); },
  simAll() { confirmBox('จำลองทุกนัดที่เหลือ', 'ใช้สำหรับทดสอบการปิดฤดูกาลและตัดสินคำทายแชมป์ แมตช์ที่ยังไม่แข่งทั้งหมดจะจบทันที และคำทายจะถูกตัดสิน', 'จำลองทั้งหมด', () => { svc.state.matches.filter((m) => ['scheduled', 'live', 'postponed'].includes(m.status)).forEach((m) => svc.adminFinishNow(adminTok(), m.id)); svc.state.matches.filter((m) => m.status === 'finished').forEach((m) => svc.adminConfirm(adminTok(), m.id)); return true; }, true); },
  closeSeason() { confirmBox('ปิดฤดูกาลและประกาศแชมป์', 'แชมป์จะตัดสินจากตารางคะแนนอย่างเป็นทางการ และคำทายแชมป์จะถูกตัดสินอัตโนมัติ', 'ปิดฤดูกาล', () => { const c = svc.adminCloseSeason(adminTok()); toast('แชมป์: ' + T(c).name, 'ok'); return c; }); },
  resetAll() { confirmBox('รีเซ็ตทุกบัญชีทดลอง', 'ยอดเครดิตทุกบัญชีจะกลับเป็นค่าเริ่มต้น คำทายที่รอผลจะถูกยกเลิก (บันทึกใน Audit Log)', 'รีเซ็ต', () => (svc.resetCredits(adminTok()), true), true); },
  resetOne(el) { confirmBox('Reset Demo Account', 'รีเซ็ตเครดิตของบัญชีนี้เป็นค่าเริ่มต้น', 'รีเซ็ต', () => (svc.resetCredits(adminTok(), el.dataset.u), true), true); },
  addTeam() {
    modal(`<h2>เพิ่มทีม</h2><form id="tf"><div class="field"><label>ชื่อทีม (ภาษาอังกฤษสำหรับรหัสทีม)</label><input class="inp" name="n" required minlength="3"></div><div class="field"><label>สีหลัก</label><input type="color" class="inp" name="c" value="#5BC0EB" style="width:80px;padding:4px"></div><button class="btn gold block" type="submit">เพิ่มทีมพร้อมนักเตะสุ่ม</button></form>`,
      (md) => md.querySelector('#tf').addEventListener('submit', (e) => { e.preventDefault(); const id = call(e.submitter, () => svc.adminAddTeam(adminTok(), e.target.n.value, e.target.c.value), 'เพิ่มทีมแล้ว'); if (id) { app.ateam = id; closeModal(); render(true); } }));
  },
  editPlayer(el) {
    const t = T(el.dataset.t); const p = t.players.find((x) => x.id === el.dataset.p); const A = { pac: 'ความเร็ว', pas: 'การส่ง', sho: 'การยิง', def: 'การป้องกัน', gk: 'ผู้รักษาประตู' };
    modal(`<h2>แก้ไขนักเตะ</h2><form id="pf"><div class="field"><label>ชื่อ</label><input class="inp" name="name" value="${esc(p.name)}" required></div>
      <div class="row"><div class="field"><label>หมายเลข</label><input class="inp" type="number" name="num" min="1" max="99" value="${p.num}" style="width:90px"></div><div class="field"><label>ตำแหน่ง</label><select class="inp" name="pos">${['GK', 'DEF', 'MID', 'FWD'].map((x) => `<option ${x === p.pos ? 'selected' : ''}>${x}</option>`).join('')}</select></div><label class="row small"><input type="checkbox" name="starter" ${p.starter ? 'checked' : ''} style="width:20px;height:20px"> ตัวจริง</label></div>
      <div class="row">${Object.entries(A).map(([k, l]) => `<div class="field"><label>${l}</label><input class="inp" type="number" min="1" max="99" name="${k}" value="${p.attrs[k]}" style="width:84px"></div>`).join('')}</div><button class="btn gold block" type="submit">บันทึกนักเตะ</button></form>`,
    (md) => md.querySelector('#pf').addEventListener('submit', (e) => { e.preventDefault(); const f = e.target; const attrs = {}; Object.keys(A).forEach((k) => { attrs[k] = f[k].value; });
      if (call(e.submitter, () => (svc.adminUpdatePlayer(adminTok(), t.id, p.id, { name: f.name.value, num: f.num.value, pos: f.pos.value, starter: f.starter.checked, attrs }), true), 'บันทึกนักเตะแล้ว')) { closeModal(); render(true); } }));
  },
  async csv() {
    const text = call(null, () => svc.exportCsv(adminTok())); if (!text) return;
    const name = 'winner69-fl7-' + svc.state.season.id + '-results.csv';
    try { const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
      if (dl) { await dl.save({ filename: name, data: new Blob([text], { type: 'text/csv' }) }); toast('ส่งออก CSV แล้ว', 'ok'); render(true); return; } } catch (e) { if (e && e.code === 'declined') { toast('ยกเลิกการดาวน์โหลด'); return; } }
    modal(`<h2>CSV ผลการแข่งขัน</h2><p class="small muted">หน้านี้ดาวน์โหลดไฟล์ตรงไม่ได้ คัดลอกข้อความด้านล่างไปบันทึกเป็นไฟล์ ${name}</p><textarea class="inp" style="height:240px;font-size:12px" readonly>${esc(text)}</textarea><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn gold" id="cp">คัดลอก</button></div>`,
      (md) => md.querySelector('#cp').addEventListener('click', () => { const ta = md.querySelector('textarea'); ta.select(); (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(() => toast('คัดลอกแล้ว', 'ok')).catch(() => { document.execCommand('copy'); toast('คัดลอกแล้ว', 'ok'); }); }));
  },
  wipe() { confirmBox('ล้างข้อมูลทั้งหมด', 'ข้อมูลฤดูกาล ผู้ใช้ เครดิต และ Audit Log ในเบราว์เซอร์นี้จะถูกลบ แล้วเริ่มใหม่ด้วยข้อมูลตัวอย่าง', 'ล้างข้อมูล', () => { try { localStorage.removeItem(STORE_KEY); } catch (e) {} svc = new W69.LeagueService({ storage }); svc.tick(); app.session = null; app.admin = null; ls.set(SESSION_KEY, null); ls.set(ADMIN_KEY, null); goHash('#/home'); return true; }, true); },
};
function reasonBox(title, ok, fn, extra) {
  modal(`<h2>${title}</h2>${extra ? `<p class="small muted">${extra}</p>` : ''}<form id="rb"><div class="field"><label>เหตุผล</label><input class="inp" name="r" required></div><div class="row" style="justify-content:flex-end"><button type="button" class="btn ghost" data-close>ปิด</button><button class="btn danger" type="submit">${ok}</button></div></form>`,
    (md) => md.querySelector('#rb').addEventListener('submit', (e) => { e.preventDefault(); if (call(e.submitter, () => (fn(e.target.r.value), true), 'บันทึกแล้ว')) { closeModal(); render(true); } }));
}
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return; const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.tagName === 'A' && el.dataset.act !== 'prepick') e.preventDefault();
  if (el.disabled) return; fn(el, e);
});
document.addEventListener('change', (e) => {
  const el = e.target.closest('[data-change]'); if (!el) return; const k = el.dataset.change; app[k] = el.value; render(true);
});
document.addEventListener('submit', (e) => {
  const f = e.target.closest('[data-form]'); if (!f) return; e.preventDefault(); const k = f.dataset.form; const btn = e.submitter;
  if (k === 'adminLogin') { const tok = call(btn, () => svc.loginAdmin(f.u.value.trim(), f.p.value)); if (tok) { app.admin = tok; ls.set(ADMIN_KEY, tok); toast('เข้าสู่ระบบผู้ดูแลแล้ว', 'ok'); render(false); } }
  if (k === 'adminPass') { if (call(btn, () => (svc.changeAdminPassword(adminTok(), f.p.value), true), 'เปลี่ยนรหัสผ่านแล้ว')) render(true); }
  if (k === 'team') { if (call(btn, () => (svc.adminUpdateTeam(adminTok(), f.dataset.id, { name: f.name.value.trim(), primary: f.primary.value.toUpperCase(), secondary: f.secondary.value.toUpperCase(), kit2: f.kit2.value.toUpperCase(), active: f.active.checked }), true), 'บันทึกทีมแล้ว')) render(true); }
  if (k === 'settings') {
    const t1 = f.t1.value, t2 = f.slotMode.value === 'same' ? t1 : f.t2.value;
    if (call(btn, () => (svc.adminUpdateSettings(adminTok(), { startingCredits: f.startingCredits ? f.startingCredits.value : undefined, stakeOptions: f.stakeOptions.value.split(','), autoConfirm: f.autoConfirm.checked, slotTimes: [t1, t2], defaultSpeed: f.defaultSpeed.value }), true), 'บันทึกการตั้งค่าแล้ว')) render(true);
  }
  if (k === 'newSeason') {
    const start = f.start.value, seed = f.seed.value;
    const go = (force) => svc.createSeason({ startDate: start, seed, force }, app.admin.admin);
    try { go(false); toast('สร้างฤดูกาลใหม่แล้ว', 'ok'); render(true); }
    catch (err) { if (err.code === 'SEASON_OPEN') confirmBox('ฤดูกาลปัจจุบันยังไม่ปิด', 'สร้างใหม่จะเก็บฤดูกาลปัจจุบันเข้าคลัง (ไม่ประกาศแชมป์) และคืนเครดิตคำทายที่รอผล ต้องการดำเนินการต่อหรือไม่', 'สร้างฤดูกาลใหม่', () => (go(true), true), true); else toast(err.message, 'err'); }
  }
});

/* boot */
if (!LINK && !location.hash) location.replace('#/home');
render(false);
</script>
</body></html>
